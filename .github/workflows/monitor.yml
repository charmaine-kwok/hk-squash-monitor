name: HK Squash Monitor

on:
  schedule:
    # Monday-Friday, every 15 minutes
    # GitHub Actions cron uses UTC.
    # 01:00-09:59 UTC = 09:00-17:59 Hong Kong time.
    # - cron: "7,22,37,52 1-9 * * 1-5"
    - cron: "*/5 * * * *"

  # Allows manual testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check squash results
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Save latest results
        run: |
          git config user.name "HK Squash Monitor"
          git config user.email "actions@users.noreply.github.com"

          git add results.json

          if git diff --cached --quiet; then
            echo "No results.json changes."
          else
            git commit -m "Update squash results"
            git push
          fi