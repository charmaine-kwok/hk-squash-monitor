<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HK Squash Match Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f6f8;
            color: #1f2937;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 28px 16px 60px;
        }

        .header {
            margin-bottom: 24px;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 28px;
        }

        .subtitle {
            margin: 0;
            color: #6b7280;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;

            margin-bottom: 24px;
        }

        .filter {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter label {
            font-size: 13px;
            font-weight: 600;
            color: #4b5563;
        }

        select {
            min-width: 170px;

            padding: 10px 12px;

            border: 1px solid #d1d5db;
            border-radius: 8px;

            background: white;

            font-size: 15px;
        }

        .summary {
            margin-bottom: 18px;

            color: #6b7280;
            font-size: 14px;
        }

        .match-card {
            background: white;

            border: 1px solid #e5e7eb;
            border-radius: 12px;

            overflow: hidden;

            margin-bottom: 20px;
        }

        .week-section-title {
            margin: 28px 0 12px;
            padding-bottom: 8px;

            border-bottom: 2px solid #d1d5db;

            font-size: 18px;
            font-weight: 700;
            color: #374151;
        }

        .week-section-title:first-child {
            margin-top: 0;
        }

        .match-header {
            padding: 18px;

            border-bottom: 1px solid #e5e7eb;
        }

        .match-meta {
            margin-bottom: 13px;

            color: #6b7280;
            font-size: 13px;
        }

        .teams {
            display: grid;

            grid-template-columns:
                minmax(0, 1fr) auto minmax(0, 1fr);

            gap: 14px;

            align-items: center;
        }

        .team {
            font-size: 17px;
            font-weight: 600;
        }

        .team.team2 {
            text-align: right;
        }

        .team-result {
            padding: 5px 10px;

            background: #f3f4f6;

            border-radius: 8px;

            font-size: 21px;
            font-weight: 700;

            white-space: nowrap;
        }

        .individual-header {
            display: grid;

            grid-template-columns:
                45px minmax(0, 1fr) 75px minmax(0, 1fr);

            gap: 10px;

            padding: 9px 18px;

            background: #fafafa;

            color: #6b7280;
            font-size: 12px;
            font-weight: 600;

            text-transform: uppercase;
        }

        .right {
            text-align: right;
        }

        .individual-match {
            display: grid;

            grid-template-columns:
                45px minmax(0, 1fr) 75px minmax(0, 1fr);

            gap: 10px;

            align-items: center;

            padding: 13px 18px;

            border-top: 1px solid #f0f0f0;
        }

        .position {
            color: #6b7280;
            font-weight: 600;
        }

        .player {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .player.team2 {
            text-align: right;
        }

        .player-link {
            border: 0;
            padding: 0;
            margin: 0;
            background: none;
            color: inherit;
            font: inherit;
            cursor: pointer;
            text-align: inherit;
            text-decoration: underline;
            text-decoration-style: dotted;
            text-underline-offset: 3px;
        }

        .player-link:hover {
            color: #2563eb;
        }

        .ranking-popup {
            position: absolute;
            z-index: 1000;
            min-width: 220px;
            max-width: 280px;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: white;
            color: #1f2937;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            font-size: 13px;
        }

        .ranking-popup-title {
            margin-bottom: 6px;
            font-weight: 700;
        }

        .ranking-popup-row {
            margin-top: 3px;
        }

        .ranking-popup-loading,
        .ranking-popup-error {
            color: #6b7280;
        }

        .score {
            text-align: center;

            font-weight: 700;

            white-space: nowrap;
        }

        .cr {
            color: #b45309;
        }

        .sub-score {
            display: block;

            margin-top: 2px;

            color: #6b7280;
            font-size: 11px;
            font-weight: 500;
        }

        .unresolved {
            color: #9ca3af;
            font-style: italic;
        }

        .status {
            margin-left: 5px;

            padding: 2px 5px;

            border-radius: 5px;

            background: #fef3c7;
            color: #92400e;

            font-size: 10px;
            font-style: normal;
        }

        .empty {
            padding: 45px 16px;

            text-align: center;

            color: #6b7280;
        }

        .error {
            padding: 18px;

            background: #fee2e2;
            color: #991b1b;

            border-radius: 8px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 22px;
            border-bottom: 1px solid #e5e7eb;
        }

        .tab-button {
            border: 0;
            background: none;
            padding: 10px 14px;
            font-size: 15px;
            font-weight: 600;
            color: #6b7280;
            cursor: pointer;
            border-bottom: 3px solid transparent;
        }

        .tab-button.active {
            color: #1f2937;
            border-bottom-color: #2563eb;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .selected-team {
            color: #2563eb;
            font-weight: 700;
        }

        .selected-team::before {
            content: "•";
            margin-right: 6px;
            color: #2563eb;
        }

        .team.team2.selected-team::before {
            content: "";
            margin: 0;
        }

        .team.team2.selected-team::after {
            content: "•";
            margin-left: 6px;
            color: #2563eb;
        }

        .schedule-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px 18px;
            margin-bottom: 14px;
        }

        .schedule-card.has-result {
            cursor: pointer;
            transition:
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        .schedule-card.has-result:hover {
            border-color: #cbd5e1;
            box-shadow: 0 3px 10px rgba(15, 23, 42, 0.07);
        }

        .schedule-card.has-result:focus-visible {
            outline: 2px solid #2563eb;
            outline-offset: 2px;
        }

        .view-player-matches {
            margin-left: auto;
            color: #2563eb;
            font-weight: 600;
            font-style: normal;
        }

        .match-card.jump-highlight {
            outline: 3px solid #93c5fd;
            outline-offset: 3px;
        }

        .schedule-teams {
            display: grid;
            grid-template-columns:
                minmax(0, 1fr) auto minmax(0, 1fr);
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }

        .schedule-vs {
            color: #9ca3af;
            font-size: 13px;
            font-weight: 600;
        }

        .schedule-details {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 18px;
            color: #6b7280;
            font-size: 13px;
        }

        .pending {
            color: #9ca3af;
            font-style: italic;
        }

        @media (max-width: 650px) {
            h1 {
                font-size: 23px;
            }

            .container {
                padding:
                    20px 10px 40px;
            }

            .teams {
                gap: 7px;
            }

            .team {
                font-size: 14px;
            }

            .team-result {
                font-size: 17px;
            }

            .individual-header,
            .individual-match {
                grid-template-columns:
                    28px minmax(0, 1fr) 55px minmax(0, 1fr);

                gap: 5px;

                padding-left: 10px;
                padding-right: 10px;
            }

            .individual-match {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>HK Squash Match Tracker</h1>

            <p class="subtitle">
                Hong Kong Squash Main League
            </p>
        </div>

        <div class="tabs">

            <button type="button" class="tab-button active" data-tab="matchesTab">
                Player Matches
            </button>

            <button type="button" class="tab-button" data-tab="scheduleTab">
                Schedule
            </button>

        </div>


        <!-- PLAYER MATCHES -->

        <div id="matchesTab" class="tab-content active">

            <div class="filters">

                <div class="filter">
                    <label for="leagueFilter">
                        Division
                    </label>

                    <select id="leagueFilter"></select>
                </div>

                <div class="filter">
                    <label for="weekFilter">
                        Week
                    </label>

                    <select id="weekFilter">
                        <option value="all">
                            All weeks
                        </option>
                    </select>
                </div>

                <div class="filter">
                    <label for="teamFilter">
                        Team
                    </label>

                    <select id="teamFilter">
                        <option value="all">
                            All teams
                        </option>
                    </select>
                </div>

            </div>

            <div id="summary" class="summary"></div>

            <div id="matches"></div>

        </div>


        <!-- SCHEDULE -->

        <div id="scheduleTab" class="tab-content">

            <div class="filters">

                <div class="filter">
                    <label for="scheduleLeagueFilter">
                        Division
                    </label>

                    <select id="scheduleLeagueFilter"></select>
                </div>

                <div class="filter">
                    <label for="scheduleWeekFilter">
                        Week
                    </label>

                    <select id="scheduleWeekFilter">
                        <option value="all">
                            All weeks
                        </option>
                    </select>
                </div>

                <div class="filter">
                    <label for="scheduleTeamFilter">
                        Team
                    </label>

                    <select id="scheduleTeamFilter">
                        <option value="all">
                            All teams
                        </option>
                    </select>
                </div>

            </div>

            <div id="scheduleSummary" class="summary"></div>

            <div id="scheduleMatches"></div>

        </div>

    </div>

    <div id="rankingPopup" class="ranking-popup" hidden></div>

    <script>

        let data = {};
        let scheduleData = {};


        const leagueFilter =
            document.getElementById(
                "leagueFilter"
            );

        const weekFilter =
            document.getElementById(
                "weekFilter"
            );

        const teamFilter =
            document.getElementById(
                "teamFilter"
            );

        const matchesContainer =
            document.getElementById(
                "matches"
            );

        const summary =
            document.getElementById(
                "summary"
            );

        const scheduleLeagueFilter =
            document.getElementById(
                "scheduleLeagueFilter"
            );

        const scheduleWeekFilter =
            document.getElementById(
                "scheduleWeekFilter"
            );

        const scheduleTeamFilter =
            document.getElementById(
                "scheduleTeamFilter"
            );

        const scheduleMatches =
            document.getElementById(
                "scheduleMatches"
            );

        const scheduleSummary =
            document.getElementById(
                "scheduleSummary"
            );

        const RANKING_API =
            "https://hk-squash-bot.mickeymousekwok97.workers.dev/ranking";

        const rankingPopup =
            document.getElementById(
                "rankingPopup"
            );

        const rankingCache = new Map();


        async function loadData() {

            try {

                const [
                    playerResponse,
                    scheduleResponse
                ] = await Promise.all([
                    fetch(
                        "./player_matches.json",
                        {
                            cache: "no-store"
                        }
                    ),

                    fetch(
                        "./schedule.json",
                        {
                            cache: "no-store"
                        }
                    )
                ]);

                if (!playerResponse.ok) {
                    throw new Error(
                        "Unable to load player_matches.json"
                    );
                }

                if (!scheduleResponse.ok) {
                    throw new Error(
                        "Unable to load schedule.json"
                    );
                }

                data =
                    await playerResponse.json();

                scheduleData =
                    await scheduleResponse.json();


                // Player matches
                populateLeagues();
                populateWeeks();
                populateTeams();
                renderMatches();


                // Schedule
                populateScheduleLeagues();
                populateScheduleWeeks();
                populateScheduleTeams();
                renderSchedule();

            }
            catch (error) {

                console.error(error);

                matchesContainer.innerHTML = `
            <div class="error">
                Unable to load match data.
            </div>
        `;

                scheduleMatches.innerHTML = `
            <div class="error">
                Unable to load schedule data.
            </div>
        `;

            }

        }

        function getFixtures(league) {

            const leagueData =
                data[league] || {};

            return Object.entries(
                leagueData
            ).filter(
                ([_, match]) => {

                    return (
                        match
                        && match.team1
                        && match.team2
                        && Array.isArray(
                            match.individual_matches
                        )
                    );

                }
            );

        }


        function populateLeagues() {

            leagueFilter.innerHTML = "";

            const leagues =
                Object.keys(data);

            leagues.forEach(
                league => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        league;

                    option.textContent =
                        `Division ${league}`;

                    leagueFilter.appendChild(
                        option
                    );

                }
            );

        }


        function getWeekNumber(week) {

            const match =
                String(week).match(
                    /\d+/
                );

            return match
                ? Number(match[0])
                : 999;
        }


        function populateWeeks() {

            const league =
                leagueFilter.value;

            const fixtures =
                getFixtures(
                    league
                );

            const weeks = [
                ...new Set(
                    fixtures
                        .map(
                            ([_, match]) =>
                                match.week
                        )
                        .filter(Boolean)
                )
            ];

            weeks.sort(
                (a, b) =>
                    getWeekNumber(a)
                    - getWeekNumber(b)
            );

            weekFilter.innerHTML = "";

            const allOption =
                document.createElement(
                    "option"
                );

            allOption.value =
                "all";

            allOption.textContent =
                "All weeks";

            weekFilter.appendChild(
                allOption
            );

            weeks.forEach(
                week => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        week;

                    option.textContent =
                        formatWeek(
                            week
                        );

                    weekFilter.appendChild(
                        option
                    );

                }
            );

        }


        function populateTeams(
            preferredTeam = "all"
        ) {

            const league =
                leagueFilter.value;

            const fixtures =
                getFixtures(
                    league
                );

            const teams =
                new Set();

            fixtures.forEach(
                ([_, match]) => {

                    if (match.team1) {
                        teams.add(
                            match.team1
                        );
                    }

                    if (match.team2) {
                        teams.add(
                            match.team2
                        );
                    }

                }
            );

            teamFilter.innerHTML = "";

            const allOption =
                document.createElement(
                    "option"
                );

            allOption.value = "all";
            allOption.textContent = "All teams";

            teamFilter.appendChild(
                allOption
            );

            [...teams]
                .sort(
                    (a, b) =>
                        a.localeCompare(b)
                )
                .forEach(
                    team => {

                        const option =
                            document.createElement(
                                "option"
                            );

                        option.value =
                            team;

                        option.textContent =
                            team;

                        teamFilter.appendChild(
                            option
                        );

                    }
                );

            if (
                preferredTeam !== "all"
                && teams.has(
                    preferredTeam
                )
            ) {
                teamFilter.value =
                    preferredTeam;
            }
            else {
                teamFilter.value =
                    "all";
            }

        }


        function formatWeek(week) {

            if (!week) {
                return "";
            }

            return String(week)
                .replace(
                    /^week/i,
                    "Week"
                );
        }


        function teamScore(
            result
        ) {

            if (!result) {
                return "";
            }

            return result
                .split("(")[0]
                .trim();
        }


        function parseDate(
            value
        ) {

            if (!value) {
                return 0;
            }

            const parts =
                value.split("/");

            if (
                parts.length !== 3
            ) {
                return 0;
            }

            const [
                day,
                month,
                year
            ] = parts.map(Number);

            return new Date(
                year,
                month - 1,
                day
            ).getTime();

        }


        function formatDate(
            value
        ) {

            if (!value) {
                return "";
            }

            const parts =
                value.split("/");

            if (
                parts.length !== 3
            ) {
                return value;
            }

            const [
                day,
                month,
                year
            ] = parts.map(Number);

            const date =
                new Date(
                    year,
                    month - 1,
                    day
                );

            return date.toLocaleDateString(
                "en-GB",
                {
                    day: "numeric",
                    month: "short",
                    year: "numeric"
                }
            );

        }

        function formatTime(
            value
        ) {

            if (!value) {
                return "";
            }

            const parts =
                value.split(":");

            if (
                parts.length < 2
            ) {
                return value;
            }

            return (
                parts[0]
                + ":"
                + parts[1]
            );

        }

        function escapeHtml(
            value
        ) {

            return String(
                value ?? ""
            )
                .replaceAll(
                    "&",
                    "&amp;"
                )
                .replaceAll(
                    "<",
                    "&lt;"
                )
                .replaceAll(
                    ">",
                    "&gt;"
                )
                .replaceAll(
                    '"',
                    "&quot;"
                )
                .replaceAll(
                    "'",
                    "&#039;"
                );

        }


        function playerHtml(
            playerName,
            memberId,
            unresolved = false
        ) {
            if (!playerName) {
                if (unresolved) {
                    return `
                        <span class="unresolved">
                            Unresolved
                        </span>
                    `;
                }

                return `
                    <span class="unresolved">
                        —
                    </span>
                `;
            }

            if (!memberId) {
                return escapeHtml(
                    playerName
                );
            }

            return `
                <button
                    type="button"
                    class="player-link"
                    data-member-id="${escapeHtml(memberId)}"
                    data-player-name="${escapeHtml(playerName)}"
                >
                    ${escapeHtml(playerName)}
                </button>
            `;
        }


        function createIndividualRow(
            match
        ) {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "individual-match";

            const isConcession =
                match.result_type
                === "concession";

            const isUnresolved =
                match.status
                === "unresolved";

            let player1 =
                playerHtml(
                    match.player1,
                    match.player1_hks_no,
                    isUnresolved
                );

            let player2 =
                playerHtml(
                    match.player2,
                    match.player2_hks_no,
                    isUnresolved
                );

            let score =
                escapeHtml(
                    match.score
                );

            if (isConcession) {

                player2 = `
            <span class="unresolved">
                No opponent
            </span>
        `;

                score = `
            <span class="cr">
                CR
            </span>

            <span class="sub-score">
                3–0
            </span>
        `;
            }

            row.innerHTML = `

        <div class="position">
            ${escapeHtml(
                match.position
            )}
        </div>

        <div class="player">
            ${player1}
        </div>

        <div class="score">
            ${score}
        </div>

        <div class="player team2">
            ${player2}
        </div>

    `;

            return row;

        }


        function renderMatches() {

            const league =
                leagueFilter.value;

            const selectedWeek =
                weekFilter.value;

            const selectedTeam =
                teamFilter.value;

            let fixtures =
                getFixtures(
                    league
                );

            if (
                selectedWeek
                !== "all"
            ) {

                fixtures =
                    fixtures.filter(
                        ([_, match]) =>
                            match.week
                            === selectedWeek
                    );

            }

            if (
                selectedTeam !== "all"
            ) {

                fixtures =
                    fixtures.filter(
                        ([_, match]) =>
                            match.team1
                            === selectedTeam
                            ||
                            match.team2
                            === selectedTeam
                    );

            }

            fixtures.sort(
                ([_, a], [__, b]) => {

                    const dateDifference =
                        parseDate(a.date)
                        - parseDate(b.date);

                    if (
                        dateDifference !== 0
                    ) {
                        return dateDifference;
                    }

                    return String(
                        a.team1
                    ).localeCompare(
                        String(
                            b.team1
                        )
                    );

                }
            );

            summary.textContent =
                `${fixtures.length} match${fixtures.length === 1
                    ? ""
                    : "es"
                }`;

            matchesContainer.innerHTML =
                "";

            if (
                fixtures.length === 0
            ) {

                matchesContainer.innerHTML = `
            <div class="empty">
                No matches found.
            </div>
        `;

                return;
            }

            fixtures.forEach(
                ([_, match]) => {

                    const team1Selected =
                        selectedTeam !== "all"
                        && match.team1 === selectedTeam;

                    const team2Selected =
                        selectedTeam !== "all"
                        && match.team2 === selectedTeam;

                    const card =
                        document.createElement(
                            "section"
                        );

                    card.className =
                        "match-card";

                    card.dataset.matchKey =
                        buildMatchKey(
                            match
                        );

                    const header =
                        document.createElement(
                            "div"
                        );

                    header.className =
                        "match-header";

                    header.innerHTML = `

                <div class="match-meta">

                    ${escapeHtml(
                        formatWeek(
                            match.week
                        )
                    )}

                    ·

                    ${escapeHtml(
                        formatDate(
                            match.date
                        )
                    )}

                </div>

                <div class="teams">

                    <div class="team ${team1Selected
                            ? "selected-team"
                            : ""
                        }">
                        ${escapeHtml(
                            match.team1
                        )}
                    </div>

                    <div class="team-result">
                        ${escapeHtml(
                            teamScore(
                                match.team_result
                            )
                        )}
                    </div>

                    <div class="team team2 ${team2Selected
                            ? "selected-team"
                            : ""
                        }">
                        ${escapeHtml(
                            match.team2
                        )}
                    </div>

                </div>

            `;

                    card.appendChild(
                        header
                    );


                    const individualHeader =
                        document.createElement(
                            "div"
                        );

                    individualHeader.className =
                        "individual-header";

                    individualHeader.innerHTML = `
                <div>Pos</div>
                <div>${escapeHtml(
                        match.team1
                    )}</div>
                <div class="right">
                    Score
                </div>
                <div class="right">
                    ${escapeHtml(
                        match.team2
                    )}
                </div>
            `;

                    card.appendChild(
                        individualHeader
                    );


                    match.individual_matches
                        .forEach(
                            individualMatch => {

                                card.appendChild(
                                    createIndividualRow(
                                        individualMatch
                                    )
                                );

                            }
                        );


                    matchesContainer.appendChild(
                        card
                    );

                }
            );

        }

        function buildMatchKey(
            match
        ) {

            return [
                match.date || "",
                match.team1 || "",
                match.team2 || ""
            ].join("|");

        }


        function switchToTab(
            tabId
        ) {

            document
                .querySelectorAll(
                    ".tab-button"
                )
                .forEach(
                    tab => {
                        tab.classList.toggle(
                            "active",
                            tab.dataset.tab
                            === tabId
                        );
                    }
                );

            document
                .querySelectorAll(
                    ".tab-content"
                )
                .forEach(
                    content => {
                        content.classList.toggle(
                            "active",
                            content.id
                            === tabId
                        );
                    }
                );

            rankingPopup.hidden = true;

        }


        function openPlayerMatch(
            league,
            scheduleMatch
        ) {

            switchToTab(
                "matchesTab"
            );

            leagueFilter.value =
                league;

            populateWeeks();

            if (
                scheduleMatch.week
                && [...weekFilter.options]
                    .some(
                        option =>
                            option.value
                            === scheduleMatch.week
                    )
            ) {
                weekFilter.value =
                    scheduleMatch.week;
            }
            else {
                weekFilter.value =
                    "all";
            }

            const scheduleSelectedTeam =
                scheduleTeamFilter.value;

            let preferredTeam =
                "all";

            if (
                scheduleSelectedTeam !== "all"
                && (
                    scheduleMatch.team1
                    === scheduleSelectedTeam
                    ||
                    scheduleMatch.team2
                    === scheduleSelectedTeam
                )
            ) {
                preferredTeam =
                    scheduleSelectedTeam;
            }

            populateTeams(
                preferredTeam
            );

            renderMatches();

            const matchKey =
                buildMatchKey(
                    scheduleMatch
                );

            const target =
                [...matchesContainer
                    .querySelectorAll(
                        ".match-card"
                    )]
                    .find(
                        card =>
                            card.dataset.matchKey
                            === matchKey
                    );

            if (!target) {
                return;
            }

            target.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

            target.classList.add(
                "jump-highlight"
            );

            window.setTimeout(
                () => {
                    target.classList.remove(
                        "jump-highlight"
                    );
                },
                1800
            );

        }


        function getScheduleFixtures(
            league
        ) {

            const leagueData =
                scheduleData[league] || {};

            return Object.entries(
                leagueData
            );

        }


        function populateScheduleLeagues() {

            scheduleLeagueFilter.innerHTML =
                "";

            Object.keys(
                scheduleData
            ).forEach(
                league => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        league;

                    option.textContent =
                        `Division ${league}`;

                    scheduleLeagueFilter
                        .appendChild(
                            option
                        );

                }
            );

        }


        function populateScheduleWeeks() {

            const league =
                scheduleLeagueFilter.value;

            const fixtures =
                getScheduleFixtures(
                    league
                );

            const weeks = [
                ...new Set(
                    fixtures
                        .map(
                            ([_, match]) =>
                                match.week
                        )
                        .filter(Boolean)
                )
            ];

            weeks.sort(
                (a, b) =>
                    getWeekNumber(a)
                    - getWeekNumber(b)
            );

            scheduleWeekFilter.innerHTML =
                "";

            const allOption =
                document.createElement(
                    "option"
                );

            allOption.value = "all";

            allOption.textContent =
                "All weeks";

            scheduleWeekFilter.appendChild(
                allOption
            );

            weeks.forEach(
                week => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        week;

                    option.textContent =
                        formatWeek(
                            week
                        );

                    scheduleWeekFilter
                        .appendChild(
                            option
                        );

                }
            );

        }


        function populateScheduleTeams() {

            const league =
                scheduleLeagueFilter.value;

            const fixtures =
                getScheduleFixtures(
                    league
                );

            const teams =
                new Set();

            fixtures.forEach(
                ([_, match]) => {

                    if (match.team1) {
                        teams.add(
                            match.team1
                        );
                    }

                    if (match.team2) {
                        teams.add(
                            match.team2
                        );
                    }

                }
            );

            scheduleTeamFilter.innerHTML =
                "";

            const allOption =
                document.createElement(
                    "option"
                );

            allOption.value =
                "all";

            allOption.textContent =
                "All teams";

            scheduleTeamFilter.appendChild(
                allOption
            );

            [...teams]
                .sort(
                    (a, b) =>
                        a.localeCompare(b)
                )
                .forEach(
                    team => {

                        const option =
                            document.createElement(
                                "option"
                            );

                        option.value =
                            team;

                        option.textContent =
                            team;

                        scheduleTeamFilter
                            .appendChild(
                                option
                            );

                    }
                );

        }


        function renderSchedule() {

            const league =
                scheduleLeagueFilter.value;

            const selectedWeek =
                scheduleWeekFilter.value;

            const selectedTeam =
                scheduleTeamFilter.value;

            let fixtures =
                getScheduleFixtures(
                    league
                );


            // Week filter
            if (
                selectedWeek !== "all"
            ) {

                fixtures =
                    fixtures.filter(
                        ([_, match]) =>
                            match.week
                            === selectedWeek
                    );

            }


            // Team filter
            if (
                selectedTeam !== "all"
            ) {

                fixtures =
                    fixtures.filter(
                        ([_, match]) =>
                            match.team1
                            === selectedTeam
                            ||
                            match.team2
                            === selectedTeam
                    );

            }


            // Date + time sorting
            fixtures.sort(
                ([_, a], [__, b]) => {

                    const dateDifference =
                        parseDate(a.date)
                        - parseDate(b.date);

                    if (
                        dateDifference !== 0
                    ) {
                        return dateDifference;
                    }

                    return String(
                        a.time || ""
                    ).localeCompare(
                        String(
                            b.time || ""
                        )
                    );

                }
            );


            scheduleSummary.textContent =
                `${fixtures.length} fixture${fixtures.length === 1
                    ? ""
                    : "s"
                }`;


            scheduleMatches.innerHTML =
                "";


            if (!fixtures.length) {

                scheduleMatches.innerHTML = `
            <div class="empty">
                No fixtures found.
            </div>
        `;

                return;
            }


            let lastWeek = null;

            fixtures.forEach(
                ([_, match]) => {

                    if (
                        selectedWeek === "all"
                        && match.week !== lastWeek
                    ) {

                        const weekTitle =
                            document.createElement(
                                "div"
                            );

                        weekTitle.className =
                            "week-section-title";

                        weekTitle.textContent =
                            formatWeek(
                                match.week
                            );

                        scheduleMatches.appendChild(
                            weekTitle
                        );

                        lastWeek =
                            match.week;
                    }


                    const card =
                        document.createElement(
                            "section"
                        );

                    card.className =
                        "schedule-card";


                    const result =
                        match.result
                            ? teamScore(
                                match.result
                            )
                            : "Pending";

                    const team1Selected =
                        selectedTeam !== "all"
                        && match.team1 === selectedTeam;

                    const team2Selected =
                        selectedTeam !== "all"
                        && match.team2 === selectedTeam;

                    card.innerHTML = `

            <div class="match-meta">

                ${escapeHtml(
                        formatDate(
                            match.date
                        )
                    )}

            </div>


            <div class="schedule-teams">

                <div class="team ${team1Selected
                            ? "selected-team"
                            : ""
                        }">
                    ${escapeHtml(
                            match.team1
                        )}
                </div>

                <div class="${match.result
                            ? "team-result"
                            : "schedule-vs"
                        }">

                    ${match.result
                            ? escapeHtml(
                                result
                            )
                            : "VS"
                        }

                </div>

                <div class="team team2 ${team2Selected
                            ? "selected-team"
                            : ""
                        }">
                    ${escapeHtml(
                            match.team2
                        )}
                </div>

            </div>


            <div class="schedule-details">

                <span>
                    📍
                    ${escapeHtml(
                            match.venue
                            || "Venue TBC"
                        )}
                </span>

                <span>
                    🕒
                    ${escapeHtml(
                            formatTime(
                                match.time
                            )
                        )}
                </span>

                ${!match.result
                            ? `
                            <span class="pending">
                                Result pending
                            </span>
                        `
                            : `
                            <span class="view-player-matches">
                                View player matches →
                            </span>
                        `
                        }

            </div>

        `;

                    if (match.result) {

                        card.classList.add(
                            "has-result"
                        );

                        card.tabIndex = 0;

                        card.setAttribute(
                            "role",
                            "button"
                        );

                        card.setAttribute(
                            "aria-label",
                            `View player matches for ${match.team1} vs ${match.team2}`
                        );

                        const openMatch = () => {
                            openPlayerMatch(
                                league,
                                match
                            );
                        };

                        card.addEventListener(
                            "click",
                            openMatch
                        );

                        card.addEventListener(
                            "keydown",
                            event => {

                                if (
                                    event.key === "Enter"
                                    || event.key === " "
                                ) {
                                    event.preventDefault();
                                    openMatch();
                                }

                            }
                        );

                    }

                    scheduleMatches.appendChild(
                        card
                    );

                }
            );

        }

        leagueFilter.addEventListener(
            "change",
            () => {

                populateWeeks();
                populateTeams();
                renderMatches();

            }
        );


        weekFilter.addEventListener(
            "change",
            renderMatches
        );


        teamFilter.addEventListener(
            "change",
            renderMatches
        );

        scheduleLeagueFilter.addEventListener(
            "change",
            () => {

                populateScheduleWeeks();
                populateScheduleTeams();
                renderSchedule();

            }
        );


        scheduleWeekFilter.addEventListener(
            "change",
            renderSchedule
        );


        scheduleTeamFilter.addEventListener(
            "change",
            renderSchedule
        );


        async function loadRanking(memberId) {
            if (rankingCache.has(memberId)) {
                return rankingCache.get(memberId);
            }

            const response = await fetch(
                `${RANKING_API}?member=${encodeURIComponent(memberId)}`
            );

            if (!response.ok) {
                throw new Error(
                    `HTTP ${response.status}`
                );
            }

            const player = await response.json();

            rankingCache.set(
                memberId,
                player
            );

            return player;
        }


        function positionPopup(button) {
            const rect =
                button.getBoundingClientRect();

            const popupWidth = 280;
            const margin = 12;

            let left =
                window.scrollX + rect.left;

            const maxLeft =
                window.scrollX
                + document.documentElement.clientWidth
                - popupWidth
                - margin;

            left = Math.max(
                window.scrollX + margin,
                Math.min(left, maxLeft)
            );

            rankingPopup.style.left =
                `${left}px`;

            rankingPopup.style.top =
                `${window.scrollY + rect.bottom + 8}px`;
        }


        async function showRanking(button) {
            const memberId =
                button.dataset.memberId;

            const playerName =
                button.dataset.playerName;

            if (!memberId) {
                return;
            }

            positionPopup(button);

            rankingPopup.hidden = false;

            rankingPopup.innerHTML = `
                <div class="ranking-popup-title">
                    ${escapeHtml(playerName)}
                </div>

                <div class="ranking-popup-loading">
                    Loading live ranking...
                </div>
            `;

            try {
                const player =
                    await loadRanking(memberId);

                const change =
                    Number(player.change ?? 0);

                const changeText =
                    change > 0
                        ? `+${change}`
                        : String(change);

                rankingPopup.innerHTML = `
                    <div class="ranking-popup-title">
                        ${escapeHtml(playerName)}
                    </div>

                    ${player.chineseName
                        ? `
                                <div class="ranking-popup-row">
                                    ${escapeHtml(player.chineseName)}
                                </div>
                            `
                        : ""
                    }

                    <div class="ranking-popup-row">
                        HKS ${escapeHtml(player.memberId)}
                    </div>

                    <div class="ranking-popup-row">
                        Overall ranking:
                        <strong>
                            ${escapeHtml(player.ranking)}
                        </strong>
                    </div>

                    <div class="ranking-popup-row">
                        Points:
                        <strong>
                            ${escapeHtml(player.points)}
                        </strong>
                    </div>

                    <div class="ranking-popup-row">
                        Change:
                        <strong>
                            ${escapeHtml(changeText)}
                        </strong>
                    </div>
                `;
            }
            catch (error) {
                console.error(error);

                rankingPopup.innerHTML = `
                    <div class="ranking-popup-title">
                        ${escapeHtml(playerName)}
                    </div>

                    <div class="ranking-popup-error">
                        Unable to load live ranking.
                    </div>
                `;
            }
        }


        // Desktop hover: show ranking when pointer enters a player name.
        document.addEventListener(
            "mouseover",
            event => {
                const button =
                    event.target.closest(
                        ".player-link"
                    );

                if (!button) {
                    return;
                }

                showRanking(button);
            }
        );


        // Click / tap: keep the popup open.
        document.addEventListener(
            "click",
            event => {
                const button =
                    event.target.closest(
                        ".player-link"
                    );

                if (button) {
                    event.preventDefault();
                    event.stopPropagation();

                    showRanking(button);
                    return;
                }

                // Clicking anywhere outside a player or popup closes it.
                if (
                    !event.target.closest(
                        "#rankingPopup"
                    )
                ) {
                    rankingPopup.hidden = true;
                }
            }
        );


        // Prevent clicks inside the popup from closing it.
        rankingPopup.addEventListener(
            "click",
            event => {
                event.stopPropagation();
            }
        );


        // Close popup when changing filters.
        leagueFilter.addEventListener(
            "change",
            () => {
                rankingPopup.hidden = true;
            }
        );

        weekFilter.addEventListener(
            "change",
            () => {
                rankingPopup.hidden = true;
            }
        );

        teamFilter.addEventListener(
            "change",
            () => {
                rankingPopup.hidden = true;
            }
        );

        document.querySelectorAll(
            ".tab-button"
        ).forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {
                        switchToTab(
                            button.dataset.tab
                        );
                    }
                );

            }
        );


        loadData();

    </script>

</body>

</html>
